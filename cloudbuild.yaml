steps:
  # Build production unified container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest'
      - '.'

  # Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME'

  # Deploy image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=GOOGLE_API_KEY:latest,SECRET_KEY=SECRET_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,QDRANT_API_KEY=QDRANT_API_KEY:latest,LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,LLM_MODEL=gemini/gemini-3.1-flash-lite,EMBEDDING_MODEL=models/gemini-embedding-001,VECTOR_DB_TYPE=qdrant,QDRANT_COLLECTION_NAME=agentic_rag_documents,QDRANT_URL=https://7e28c9e6-5aa7-41b9-9a5e-49b50e5a650c.us-east4-0.gcp.cloud.qdrant.io,RETRIEVAL_TOP_K=5,USE_HYBRID_SEARCH=true,LANGSMITH_TRACING=true,LANGSMITH_ENDPOINT=https://api.smith.langchain.com,LANGSMITH_PROJECT=Agentic_RAG,MODEL_ARMOR_ENABLED=$_MODEL_ARMOR_ENABLED,MODEL_ARMOR_PROJECT_ID=$_MODEL_ARMOR_PROJECT_ID,MODEL_ARMOR_LOCATION=$_MODEL_ARMOR_LOCATION,MODEL_ARMOR_TEMPLATE_ID=$_MODEL_ARMOR_TEMPLATE_ID'

images:
  - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest'

substitutions:
  _DEPLOY_REGION: asia-south1
  _AR_HOSTNAME: asia-south1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _SERVICE_NAME: enterprise-ai-platform-with-agentic-retrieval
  _MODEL_ARMOR_ENABLED: 'true'
  _MODEL_ARMOR_PROJECT_ID: agentic-rag-504707
  _MODEL_ARMOR_LOCATION: us-central1
  _MODEL_ARMOR_TEMPLATE_ID: my-rag-guardrail-template

options:
  logging: CLOUD_LOGGING_ONLY
