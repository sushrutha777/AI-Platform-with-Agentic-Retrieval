<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1650" viewBox="0 0 1000 1650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b9c1ca"/>
    </marker>
    <style>
      .bg { fill:#0d1117; }
      .box { fill:#171b21; stroke:#aeb6bf; stroke-width:2; }
      .group { fill:#3c3f42; stroke:#666b70; stroke-width:2; }
      .diamond { fill:#171b21; stroke:#aeb6bf; stroke-width:2; }
      .title { fill:#f4f6f8; font:600 19px Arial,sans-serif; }
      .label { fill:#edf0f2; font:500 15px Arial,sans-serif; }
      .small { fill:#cbd1d7; font:400 13px Arial,sans-serif; }
      .edge { fill:none; stroke:#aeb6bf; stroke-width:2; marker-end:url(#arrow); }
      .tag { fill:#0d1117; }
      .tag-text { fill:#e7ebef; font:400 13px Arial,sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="1650"/>

  <!-- Main linear flow -->
  <rect class="box" x="375" y="35" width="250" height="62"/>
  <text class="label" x="500" y="72" text-anchor="middle">User Query</text>

  <path class="edge" d="M500 97 V135"/>
  <rect class="box" x="320" y="135" width="360" height="78"/>
  <text class="label" x="500" y="169" text-anchor="middle">Model Armor: Input</text>
  <text class="label" x="500" y="191" text-anchor="middle">Sanitization</text>

  <path class="edge" d="M500 213 V250"/>
  <polygon class="diamond" points="500,250 650,355 500,460 350,355"/>
  <text class="label" x="500" y="350" text-anchor="middle">Context</text>
  <text class="label" x="500" y="372" text-anchor="middle">Required?</text>

  <rect class="tag" x="225" y="294" width="110" height="26"/>
  <text class="tag-text" x="280" y="313" text-anchor="middle">Self-Contained</text>
  <rect class="tag" x="650" y="294" width="110" height="26"/>
  <text class="tag-text" x="705" y="313" text-anchor="middle">Needs Context</text>

  <path class="edge" d="M350 355 C280 390 280 430 500 490"/>
  <path class="edge" d="M650 355 C720 390 720 430 500 490"/>

  <rect class="box" x="330" y="490" width="340" height="70"/>
  <text class="label" x="500" y="519" text-anchor="middle">LLM Context Rewrite</text>
  <text class="small" x="500" y="542" text-anchor="middle">only for contextual follow-ups</text>

  <path class="edge" d="M500 560 V595"/>
  <rect class="box" x="300" y="595" width="400" height="72"/>
  <text class="label" x="500" y="625" text-anchor="middle">Zero-LLM Heuristic Intent Router</text>
  <text class="small" x="500" y="648" text-anchor="middle">greeting • casual • knowledge</text>

  <!-- Route branches -->
  <path class="edge" d="M300 631 C175 680 160 730 160 820 V1250"/>
  <rect class="tag" x="52" y="700" width="150" height="26"/>
  <text class="tag-text" x="127" y="719" text-anchor="middle">Greeting / Casual</text>

  <path class="edge" d="M700 631 C810 680 840 720 840 785"/>
  <rect class="tag" x="730" y="682" width="160" height="26"/>
  <text class="tag-text" x="810" y="701" text-anchor="middle">Knowledge Search</text>

  <!-- Parallel retrieval block -->
  <rect class="group" x="70" y="785" width="860" height="345" rx="4"/>
  <text class="title" x="500" y="820" text-anchor="middle">Parallel Tool Execution</text>
  <text class="small" x="500" y="845" text-anchor="middle">asyncio.gather(..., return_exceptions=True)</text>

  <rect class="box" x="330" y="870" width="340" height="68"/>
  <text class="label" x="500" y="899" text-anchor="middle">Parallel Tool Dispatch</text>
  <text class="small" x="500" y="922" text-anchor="middle">selected tools execute concurrently</text>

  <path class="edge" d="M500 845 V870"/>
  <path class="edge" d="M430 938 C350 955 245 965 205 1000"/>
  <path class="edge" d="M500 938 V1000"/>
  <path class="edge" d="M570 938 C650 955 755 965 795 1000"/>

  <rect class="box" x="105" y="1000" width="200" height="88"/>
  <text class="label" x="205" y="1028" text-anchor="middle">Document Hybrid Search</text>
  <text class="small" x="205" y="1051" text-anchor="middle">Qdrant + BM25</text>
  <text class="small" x="205" y="1071" text-anchor="middle">+ FlashRank</text>

  <rect class="box" x="400" y="1000" width="200" height="88"/>
  <text class="label" x="500" y="1028" text-anchor="middle">Web Search</text>
  <text class="small" x="500" y="1051" text-anchor="middle">Tavily / DuckDuckGo</text>
  <text class="small" x="500" y="1071" text-anchor="middle">fault isolated</text>

  <rect class="box" x="695" y="1000" width="200" height="88"/>
  <text class="label" x="795" y="1028" text-anchor="middle">Wikipedia Search</text>
  <text class="small" x="795" y="1051" text-anchor="middle">encyclopedic context</text>
  <text class="small" x="795" y="1071" text-anchor="middle">fault isolated</text>

  <!-- Aggregation and generation -->
  <path class="edge" d="M205 1088 C205 1145 365 1160 500 1160"/>
  <path class="edge" d="M500 1088 V1160"/>
  <path class="edge" d="M795 1088 C795 1145 635 1160 500 1160"/>

  <rect class="box" x="310" y="1160" width="380" height="76"/>
  <text class="label" x="500" y="1191" text-anchor="middle">Context Aggregator &amp; Fault Handler</text>
  <text class="small" x="500" y="1215" text-anchor="middle">evidence + citations + valid results</text>

  <path class="edge" d="M500 1236 V1272"/>
  <rect class="box" x="310" y="1272" width="380" height="76"/>
  <text class="label" x="500" y="1303" text-anchor="middle">Synthesis Prompt Generation</text>
  <text class="small" x="500" y="1327" text-anchor="middle">context + history + query</text>

  <path class="edge" d="M500 1348 V1385"/>
  <rect class="box" x="310" y="1385" width="380" height="76"/>
  <text class="label" x="500" y="1416" text-anchor="middle">Single Final LLM Call</text>
  <text class="small" x="500" y="1440" text-anchor="middle">Gemini primary / Groq fallback</text>

  <!-- Direct branch joins -->
  <rect class="box" x="35" y="1250" width="250" height="76"/>
  <text class="label" x="160" y="1281" text-anchor="middle">Direct LLM / Instant Reply</text>
  <text class="small" x="160" y="1305" text-anchor="middle">no retrieval for greeting/casual</text>
  <path class="edge" d="M160 1326 C160 1495 350 1500 420 1500"/>
  <path class="edge" d="M500 1461 V1500"/>

  <rect class="box" x="300" y="1500" width="400" height="70"/>
  <text class="label" x="500" y="1530" text-anchor="middle">FastAPI SSE Stream Engine</text>
  <text class="small" x="500" y="1553" text-anchor="middle">progress • metadata • metrics • tokens • done</text>

  <path class="edge" d="M500 1570 V1600"/>
  <rect class="box" x="375" y="1600" width="250" height="42"/>
  <text class="label" x="500" y="1627" text-anchor="middle">React Frontend Client</text>
</svg>
